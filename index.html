<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Translate Minecraft mods, modpacks, Java and Bedrock worlds, Add-ons, resource packs, data packs, and server plugins locally in your browser without uploading files."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://babel-breaker.web.app/" />
    <link rel="alternate" hreflang="x-default" href="https://babel-breaker.web.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Babel Breaker" />
    <meta property="og:url" content="https://babel-breaker.web.app/" />
    <meta property="og:title" content="Babel Breaker — Translate Game Files in Your Browser" />
    <meta
      property="og:description"
      content="Translate Minecraft mods, modpacks, Java and Bedrock worlds, Add-ons, resource packs, data packs, and server plugins locally in your browser."
    />
    <meta property="og:image" content="https://babel-breaker.web.app/icon.png" />
    <meta property="og:image:alt" content="Babel Breaker icon" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Babel Breaker — Browser Game Translator" />
    <meta
      name="twitter:description"
      content="Private browser-based translation for mods, modpacks, worlds, Add-ons, resource packs, data packs, and server plugins."
    />
    <meta name="twitter:image" content="https://babel-breaker.web.app/icon.png" />
    <link rel="icon" href="/icon-ui.png" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Babel Breaker — Translate Game Files in Your Browser</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Babel Breaker",
        "url": "https://babel-breaker.web.app/",
        "description": "A private browser tool for translating Minecraft mods, modpacks, Java and Bedrock worlds, Add-ons, resource packs, data packs, and server plugins.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript, WebAssembly, and Web Workers for local translation",
        "isAccessibleForFree": true,
        "inLanguage": ["en", "ja", "ko", "zh-Hans", "es"],
        "featureList": [
          "Processes mod archives without uploading them",
          "Translates text locally in the browser",
          "Translates Patchouli guidebooks and preserves Patchouli formatting",
          "Translates FTB Quests SNBT and binary NBT plus Better Questing JSON",
          "Supports Modrinth and CurseForge modpacks",
          "Supports Java worlds, Bedrock Add-ons, and Bedrock worlds",
          "Supports Java and Bedrock resource packs, data packs, and server plugin language files",
          "Supports Minecraft, Factorio, Stardew Valley, and RimWorld language formats",
          "Exports resource packs, Minecraft translation bundles, translated mods, or standalone translation mods"
        ],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <main>
        <h1>Babel Breaker — browser-based game mod translator</h1>
        <p>
          Translate Minecraft mods, modpacks, Java and Bedrock worlds, Add-ons,
          resource packs, data packs, server plugins, Factorio, Stardew Valley,
          and RimWorld mods without uploading files.
          JavaScript is required to run the tool.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
